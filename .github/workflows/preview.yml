name: PR Preview

# Replaces the per-PR preview deployments that Vercel's Git integration used to
# create, now that vercel.json turns automatic deployments off.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Deploy Preview
    # Pull requests from forks do not receive repository secrets, so the Vercel
    # deploy would fail with a confusing auth error. Skip them outright.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: TEMP diagnose token access
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "token length: ${#TOKEN}"
          case "$TOKEN" in
            vcp_*) echo "prefix: vcp_ (personal access token)" ;;
            *) echo "prefix: NOT vcp_ — first 4 chars: $(printf '%s' "$TOKEN" | cut -c1-4)" ;;
          esac
          printf 'has whitespace: '
          case "$TOKEN" in *[[:space:]]*) echo YES ;; *) echo no ;; esac
          echo "--- GET /v9/projects/\$VERCEL_PROJECT_ID ---"
          curl -s -o /tmp/proj.json -w 'HTTP %{http_code}\n' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $TOKEN"
          head -c 400 /tmp/proj.json; echo

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            // Upsert a single comment rather than adding a new one per push.
            const marker = '<!-- preview-deployment -->';
            const body = [
              marker,
              '### Preview deployment',
              '',
              `:rocket: ${process.env.PREVIEW_URL}`,
              '',
              `Commit \`${context.sha.slice(0, 7)}\` · updated automatically on every push.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
